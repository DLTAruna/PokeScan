<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Génération des icônes PokéScan</title>
<style>
  body{background:#0a0d16; color:#e6e9f0; font-family:system-ui,sans-serif; padding:20px;}
  canvas{background:#222; margin:8px; vertical-align:top; border:1px solid #333;}
</style>
</head>
<body>
<h1>Icônes PokéScan</h1>
<p>Cette page ne sert qu'à produire les PNG de l'application installée. Elle rend le tracé
   SVG ci-dessous à plusieurs tailles et expose les données en base64, que le script de
   génération récupère pour écrire les fichiers. Elle n'est pas utilisée par l'application.</p>
<div id="sorties"></div>

<script>
// Marque de l'application : une carte inclinée, traversée par un faisceau de lecture.
// Le sujet est « scanner une carte », pas « Pokémon » — un logo officiel serait de toute
// façon inutilisable, et la carte se lit à 48 px là où une créature ne se lirait plus.
//
// Fond doré plein plutôt que sombre : sur l'écran d'accueil, l'icône est entourée du fond
// d'écran de l'utilisateur, souvent clair. Une icône sombre y disparaît, une icône dorée
// reste repérable quel que soit le fond.
const SVG = (t) => `
<svg xmlns="http://www.w3.org/2000/svg" width="${t}" height="${t}" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd95e"/>
      <stop offset="1" stop-color="#e0a900"/>
    </linearGradient>
    <linearGradient id="carte" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1b2334"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="faisceau" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fond)"/>

  <!-- Carte inclinee. L'inclinaison evite l'aspect « document » d'un rectangle droit et
       rappelle le geste de presentation devant l'objectif. -->
  <g transform="rotate(-11 256 256)">
    <rect x="150" y="112" width="212" height="288" rx="22" fill="url(#carte)"/>
    <rect x="150" y="112" width="212" height="288" rx="22" fill="none"
          stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>
    <!-- Fenetre d'illustration : la proportion est celle d'une vraie carte, c'est elle qui
         la rend reconnaissable plutot qu'un simple rectangle arrondi. -->
    <rect x="176" y="146" width="160" height="118" rx="10" fill="#ffcb05" fill-opacity="0.92"/>
    <rect x="176" y="288" width="160" height="15" rx="7" fill="#ffffff" fill-opacity="0.34"/>
    <rect x="176" y="318" width="112" height="15" rx="7" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="176" y="352" width="64" height="15" rx="7" fill="#ffffff" fill-opacity="0.5"/>
  </g>

  <!-- Faisceau de lecture, horizontal et non incline : c'est l'appareil qui balaie, pas la
       carte qui bouge. -->
  <rect x="60" y="242" width="392" height="26" rx="13" fill="url(#faisceau)"/>
  <rect x="60" y="252" width="392" height="6" rx="3" fill="#ffffff" fill-opacity="0.85"/>
</svg>`;

async function rendre(taille){
  const blob = new Blob([SVG(taille)], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  await new Promise((ok, ko)=>{ img.onload = ok; img.onerror = ko; img.src = url; });
  const c = document.createElement('canvas');
  c.width = taille; c.height = taille;
  c.getContext('2d').drawImage(img, 0, 0, taille, taille);
  URL.revokeObjectURL(url);
  document.getElementById('sorties').appendChild(c);
  return c.toDataURL('image/png');
}

window.genererIcones = async function(){
  const out = {};
  for(const t of [192, 512, 180]) out[t] = await rendre(t);
  return out;
};
</script>
</body>
</html>
